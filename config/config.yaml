project_name: olist_delivery_prediction
version: 1.0.0

paths:
  project_root: "."
  data_dir: "data"
  task2_dir: "task2"
  models_dir: "models"
  logs_dir: "logs"
  artifacts_dir: "artifacts"
  mlruns_dir: "mlruns"

model:
  name: "logistic_regression"
  threshold: 0.5
  artifact_path: "models/logistic_model.joblib"
  preprocessor_path: "models/preprocessor.joblib"

features:
  numeric:
    - item_count
    - distinct_product_count
    - distinct_seller_count
    - merchandise_value
    - freight_value
    - order_value
    - payment_record_count
    - paid_value
    - max_installments
    - payment_type_count
    - category_count
    - geo_distance_km
    - purchase_hour
    - purchase_weekday_num
    - purchase_month

  categorical:
    - customer_state
    - seller_state
    - payment_type_primary

  target: delivered_late

validation:
  min_rows: 1
  required_columns:
    - order_purchase_timestamp
    - customer_state
    - seller_state
    - payment_type_primary

api:
  host: "0.0.0.0"
  port: 8000
