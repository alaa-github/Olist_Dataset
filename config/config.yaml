project_name: olist_delivery_prediction
version: 1.0.0

paths:
  project_root: "."
  data_dir: "data"
  task2_dir: "task2"
  models_dir: "models"
  logs_dir: "logs"
  artifacts_dir: "artifacts"
  mlruns_dir: "mlruns"

model:
  name: "logistic_regression"
  threshold: 0.5
  artifact_path: "models/logistic_model.joblib"
  preprocessor_path: "models/preprocessor.joblib"

features:
  numeric:
    - total_price
    - total_freight
    - items_count
    - total_payment
    - max_installments

  categorical: []

  target: is_late

validation:
  min_rows: 1
  required_columns:
    - total_price
    - total_freight
    - items_count
    - total_payment
    - max_installments

api:
  host: "0.0.0.0"
  port: 8000
